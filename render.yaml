services:
  # Backend Flask Web Service on Render
  - type: web
    name: datastraw-roster-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false # Set in Render dashboard with your MongoDB Atlas connection string
      - key: DB_NAME
        value: datastraw_roster
      - key: CORS_ORIGINS
        value: "*"

  # Frontend React Static Site on Render
  - type: web
    name: datastraw-roster-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://datastraw-roster-backend.onrender.com/api
